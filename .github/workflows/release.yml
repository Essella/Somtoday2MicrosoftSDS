name: Release Somtoday2MicrosoftSDS

on:
  release:
    types: [published]

permissions: {}

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Validate and extract release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+\.\d+)$') {
            throw "Release tag '$tag' is invalid. Use v1.2.3.4."
          }

          $version = [Version]$Matches.version
          if ($version.Major -gt 65534 -or
              $version.Minor -gt 65534 -or
              $version.Build -gt 65534 -or
              $version.Revision -gt 65534) {
            throw "Every version component must be between 0 and 65534."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

  test:
    name: Test release (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Somtoday2MicrosoftSDS.sln

      - name: Test release build
        run: >-
          dotnet test Somtoday2MicrosoftSDS.sln
          --configuration Release
          --no-restore
          -p:Version=${{ needs.version.outputs.version }}
          -p:AssemblyVersion=${{ needs.version.outputs.version }}
          -p:FileVersion=${{ needs.version.outputs.version }}
          -p:InformationalVersion=${{ needs.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

  container-image:
    name: Publish container image
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/essella/somtoday2microsoftsds

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=sha,format=short
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/Essella/Somtoday2MicrosoftSDS
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: false
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
