name: Release Somtoday2MicrosoftSDS

on:
  release:
    types: [published]
  schedule:
    - cron: '44 4 * * 4'
  workflow_dispatch:

concurrency:
  group: release-container-publication
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Resolve and validate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      is_refresh: ${{ steps.version.outputs.is_refresh }}

    steps:
      - name: Resolve and validate release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:EVENT_NAME -eq 'release') {
            $tag = $env:RELEASE_TAG
            $isRefresh = 'false'
          }
          elseif ($env:EVENT_NAME -eq 'schedule' -or $env:EVENT_NAME -eq 'workflow_dispatch') {
            $response = gh api "repos/$env:GH_REPOSITORY/releases/latest"
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not resolve the latest published GitHub Release.'
            }

            $release = ($response -join "`n") | ConvertFrom-Json
            if ($release.draft -or $release.prerelease -or [string]::IsNullOrWhiteSpace($release.tag_name)) {
              throw 'The latest GitHub Release must be published and must not be a prerelease.'
            }

            $tag = [string]$release.tag_name
            $isRefresh = 'true'
          }
          else {
            throw "Unsupported workflow event '$env:EVENT_NAME'."
          }

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+\.\d+)$') {
            throw "Release tag '$tag' is invalid. Use v1.2.3.4."
          }

          $version = [Version]$Matches.version
          if ($version.Major -gt 65534 -or
              $version.Minor -gt 65534 -or
              $version.Build -gt 65534 -or
              $version.Revision -gt 65534) {
            throw "Every version component must be between 0 and 65534."
          }

          "version=$($version.ToString(4))" >> $env:GITHUB_OUTPUT
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "is_refresh=$isRefresh" >> $env:GITHUB_OUTPUT

  test:
    name: Test release (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_tag }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Somtoday2MicrosoftSDS.sln

      - name: Test release build
        run: >-
          dotnet test Somtoday2MicrosoftSDS.sln
          --configuration Release
          --no-restore
          -p:Version=${{ needs.version.outputs.version }}
          -p:AssemblyVersion=${{ needs.version.outputs.version }}
          -p:FileVersion=${{ needs.version.outputs.version }}
          -p:InformationalVersion=${{ needs.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

  infrastructure:
    name: Validate infrastructure
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_tag }}

      - name: Prepare latest Bicep validation
        shell: pwsh
        run: |
          az bicep install
          az bicep upgrade
          $sourceRevision = git rev-parse HEAD
          Write-Host "Commit: $sourceRevision"
          az bicep version

      - name: Validate Bicep, ARM, and portal form
        shell: pwsh
        run: ./scripts/validate-infrastructure.ps1

  csv-bootstrap-release:
    name: Generate and publish CSV bootstrap zips
    needs: [version, test, infrastructure]
    if: ${{ needs.version.outputs.is_refresh == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_tag }}

      - name: Generate all CSV bootstrap sets
        shell: pwsh
        run: |
          $outputRoot = Join-Path $PWD 'artifacts/sds-bootstrap-csv'
          ./scripts/generate-empty-csv-files.ps1 -Version all -Guardians both -OutputPath $outputRoot

      - name: Zip generated CSV sets
        shell: pwsh
        run: |
          $outputRoot = Join-Path $PWD 'artifacts/sds-bootstrap-csv'

          Get-ChildItem -Path $outputRoot -Directory | ForEach-Object {
            $zipPath = Join-Path $outputRoot "$($_.Name).zip"
            Compress-Archive -Path (Join-Path $_.FullName '*') -DestinationPath $zipPath -CompressionLevel Optimal -Force
            Write-Host "Created: $zipPath"
          }

          $zipFiles = Get-ChildItem -Path $outputRoot -Filter '*.zip'
          if ($zipFiles.Count -eq 0) {
            throw 'No CSV zip files were generated.'
          }

      - name: Upload CSV zips to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/sds-bootstrap-csv/*.zip

  container-image:
    name: Publish container image
    needs: [version, test, infrastructure]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE_NAME: ghcr.io/essella/somtoday2microsoftsds
      REFRESH_TAG: ${{ needs.version.outputs.version }}-refresh.${{ github.run_number }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_tag }}

      - name: Resolve release commit
        id: source
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_revision=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify refresh tag is new
        if: ${{ needs.version.outputs.is_refresh == 'true' }}
        shell: bash
        run: |
          set +e
          inspect_output=$(docker buildx imagetools inspect "$IMAGE_NAME:$REFRESH_TAG" 2>&1)
          inspect_status=$?
          set -e

          if [ "$inspect_status" -eq 0 ]; then
            echo "::error::Refresh tag '$REFRESH_TAG' already exists. Start a new workflow run to create a new immutable refresh tag."
            exit 1
          fi

          if ! grep -Eqi 'manifest unknown|name unknown|not found' <<< "$inspect_output"; then
            echo "$inspect_output"
            echo "::error::Could not determine whether refresh tag '$REFRESH_TAG' already exists."
            exit "$inspect_status"
          fi

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.is_refresh == 'false' }}
            type=raw,value=sha-${{ steps.source.outputs.short_revision }},enable=${{ needs.version.outputs.is_refresh == 'false' }}
            type=raw,value=${{ env.REFRESH_TAG }},enable=${{ needs.version.outputs.is_refresh == 'true' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/Essella/Somtoday2MicrosoftSDS
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: false
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ steps.source.outputs.revision }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
